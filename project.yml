name: MacroStack
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGNING_ALLOWED: NO
targets:
  MacroStack:
    type: application
    platform: iOS
    sources:
      - path: MacroStack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.macrostack
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MacroStack
        INFOPLIST_KEY_NSCameraUsageDescription: Capture close-up photos at several focus positions to combine their sharp details.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save the stacked photo you choose to your photo library.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
  MacroStackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MacroStackTests
    dependencies:
      - target: MacroStack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.macrostack.tests
schemes:
  MacroStack:
    build:
      targets:
        MacroStack: all
    test:
      targets:
        - MacroStackTests

